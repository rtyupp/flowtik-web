<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أبو عسرة">
  <meta name="theme-color" content="#05070B">
  <title>أبو عسرة · Flowtik 120 FPS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icon-192.png?v=3">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon.png?v=3">
  <link rel="manifest" href="manifest.json?v=3">

  <style>
    :root {
      --bg: #05070B;
      --surface: rgba(16, 20, 29, 0.78);
      --surface-elevated: rgba(24, 30, 44, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(56, 189, 248, 0.42);
      --accent: #38BDF8;
      --accent-2: #2DD4BF;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --success: #34D399;
      --danger: #FB7185;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 18px) + 20px) 16px calc(env(safe-area-inset-bottom, 18px) + 28px);
      position: relative;
      background-image:
        radial-gradient(80% 50% at 50% -10%, rgba(56, 189, 248, 0.18) 0%, transparent 70%),
        radial-gradient(60% 45% at 85% 95%, rgba(45, 212, 191, 0.12) 0%, transparent 70%),
        radial-gradient(50% 40% at 10% 80%, rgba(129, 140, 248, 0.12) 0%, transparent 70%);
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 6px 4px;
    }

    .brand-identity {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 24px rgba(56, 189, 248, 0.18);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-family: 'Lalezar', 'Tajawal', sans-serif;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 0.2px;
      line-height: 1.05;
      background: linear-gradient(135deg, #FFFFFF 20%, #BAE6FD 65%, #38BDF8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(56, 189, 248, 0.28));
    }

    .brand-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .ver-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.28);
      color: var(--success);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }

    .ver-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .studio-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .drop-zone {
      border: 1.5px dashed rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-md);
      padding: 34px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.06);
      transform: translateY(-1px);
    }

    .drop-zone:active {
      transform: scale(0.985);
    }

    .upload-orb {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(45, 212, 191, 0.12));
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
    }

    .upload-orb svg {
      width: 26px;
      height: 26px;
      stroke-width: 2;
    }

    .drop-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    .drop-hint {
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'Plus Jakarta Sans', 'JetBrains Mono', sans-serif;
      font-weight: 600;
    }

    .file-pill {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      border: 1px solid rgba(56, 189, 248, 0.3);
      animation: fadeUp 0.25s ease;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .file-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031018;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
    }

    .file-badge svg {
      width: 20px;
      height: 20px;
    }

    .file-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .file-size {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-weight: 700;
    }

    .btn-clear {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(251, 113, 133, 0.28);
      background: rgba(251, 113, 133, 0.1);
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      background: rgba(251, 113, 133, 0.22);
      border-color: var(--danger);
    }

    .mode-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mode-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .fps-option {
      padding: 14px 12px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.025);
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      transition: all 0.22s ease;
      position: relative;
    }

    .fps-option:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
    }

    .fps-option.active {
      background: linear-gradient(145deg, rgba(56, 189, 248, 0.14), rgba(45, 212, 191, 0.07));
      border-color: var(--border-strong);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.12);
    }

    .fps-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .fps-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.3px;
    }

    .fps-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .fps-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-primary {
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(135deg, #38BDF8 0%, #2DD4BF 100%);
      color: #041019;
      font-family: 'Tajawal', sans-serif;
      font-size: 16.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.25);
      transition: all 0.22s ease;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 16px 34px rgba(56, 189, 248, 0.35);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.985);
    }

    .btn-primary:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(0.4);
    }

    .btn-download {
      display: none;
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #34D399 0%, #10B981 100%);
      color: #03150E;
      font-family: 'Tajawal', sans-serif;
      font-size: 16.5px;
      font-weight: 800;
      text-decoration: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 12px 30px rgba(52, 211, 153, 0.28);
      transition: all 0.22s ease;
    }

    .btn-download:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .log-box {
      display: none;
      background: rgba(5, 7, 11, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.75;
      color: var(--text-muted);
      max-height: 135px;
      overflow-y: auto;
      direction: ltr;
      text-align: left;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-line .dot {
      color: var(--accent);
      font-size: 8px;
    }

    .status-line.success {
      color: var(--success);
      font-weight: 700;
    }
    .status-line.success .dot {
      color: var(--success);
    }

    .status-line.warning {
      color: var(--danger);
      font-weight: 700;
    }
    .status-line.warning .dot {
      color: var(--danger);
    }

    .pwa-hint {
      text-align: center;
      font-size: 12.5px;
      color: var(--text-dim);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: rgba(16, 20, 29, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.6;
    }

    .pwa-hint b {
      color: var(--accent);
      font-weight: 700;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <main class="app-shell">
    <header class="brand-bar">
      <div class="brand-identity">
        <img src="apple-touch-icon.png?v=3" alt="أبو عسرة" class="brand-icon">
        <div class="brand-text">
          <h1 class="brand-title">أبو عسرة</h1>
          <p class="brand-sub">معالجة 60 / 120 FPS بدون ضغط</p>
        </div>
      </div>
      <div class="ver-pill">v2.8</div>
    </header>

    <section class="studio-card">
      <div class="drop-zone" id="dropArea">
        <div class="upload-orb">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
          </svg>
        </div>
        <div>
          <div class="drop-title">اختر الفيديو من جهازك</div>
          <div class="drop-hint">MP4 · MOV · Zero Re-encoding</div>
        </div>
      </div>
      <input type="file" id="mediaInput" accept="video/mp4,video/quicktime,video/*">

      <div class="file-pill" id="fileBox">
        <div class="file-info">
          <div class="file-badge">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
            </svg>
          </div>
          <div class="file-meta">
            <div class="file-name" id="labelName">video.mp4</div>
            <div class="file-size" id="labelSize">0.0 MB</div>
          </div>
        </div>
        <button class="btn-clear" id="btnCancel" title="إزالة">✕</button>
      </div>

      <div class="mode-section">
        <div class="mode-label">
          <span>وضع الفريمات</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);">DUAL ENGINE</span>
        </div>
        <div class="mode-grid">
          <div class="fps-option active" data-fps="120" onclick="setFps(120)">
            <div class="fps-top">
              <span class="fps-num">120 FPS</span>
              <span class="fps-tag">الأسرع</span>
            </div>
            <div class="fps-desc">محرك Flowtik المباشر</div>
          </div>

          <div class="fps-option" data-fps="60" onclick="setFps(60)">
            <div class="fps-top">
              <span class="fps-num">60 FPS</span>
            </div>
            <div class="fps-desc">تعديل التوقيت الزمني</div>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="btnProcess" disabled onclick="runProcess()">
        <span>بدء معالجة 120 FPS</span>
      </button>

      <a class="btn-download" id="btnDownload" download="Flowtik_120fps.mp4">
        <span>حفظ الفيديو الجاهز</span>
      </a>

      <div class="log-box" id="terminalBox"></div>
    </section>

    <div class="pwa-hint">
      لتثبيت التطبيق على الآيفون: <b>مشاركة ⬆️</b> ← <b>إضافة إلى الشاشة الرئيسية</b>
    </div>
  </main>

    // ===== Port of the original Flowtik v2.8 sandbox (chunks/sandbox-D1QuYD8F.js) =====
    'use strict';
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const FAST = new URLSearchParams(location.search).has('fast');
    const wait = (ms) => FAST ? Promise.resolve() : sleep(ms);

    let flowtikWasm = null;
    let ffCore = null, ffDuration = 0;
    let currentFile = null;
    let selectedFps = 120;
    let lastUrl = null;
    let busy = false;

    const $ = (id) => document.getElementById(id);
    const dropArea = $('dropArea'), mediaInput = $('mediaInput'), fileBox = $('fileBox'),
          labelName = $('labelName'), labelSize = $('labelSize'), btnCancel = $('btnCancel'),
          btnProcess = $('btnProcess'), btnDownload = $('btnDownload'), terminalBox = $('terminalBox');

    function setLabel(t) { btnProcess.querySelector('span').textContent = t; }
    function idleLabel() {
      setLabel(selectedFps === 120 ? 'بدء معالجة 120 FPS' : 'بدء معالجة 60 FPS');
    }

    function setFps(fps) {
      if (busy) return;
      selectedFps = fps;
      document.querySelectorAll('.fps-option').forEach(el =>
        el.classList.toggle('active', parseInt(el.dataset.fps, 10) === fps));
      if (currentFile) { btnDownload.style.display = 'none'; btnProcess.style.display = 'flex'; btnProcess.disabled = false; }
      idleLabel();
    }
    window.setFps = setFps;

    function appendLog(text, type = 'normal') {
      terminalBox.style.display = 'block';
      const row = document.createElement('div');
      row.className = 'status-line ' + type;
      const dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = '●';
      const msg = document.createElement('span'); msg.textContent = text;
      row.append(dot, ' ', msg);
      terminalBox.appendChild(row);
      terminalBox.scrollTop = terminalBox.scrollHeight;
    }

    async function initFlowtikWasm() {
      if (flowtikWasm) return flowtikWasm;
      const bin = Uint8Array.from(atob(FLOWTIK_WASM_BASE64), c => c.charCodeAt(0));
      flowtikWasm = (await WebAssembly.instantiate(bin)).instance;
      flowtikWasm.exports.decrypt_secrets();
      return flowtikWasm;
    }

    function loadScript(src) {
      return new Promise((res, rej) => {
        if (typeof createFFmpegCore === 'function') return res();
        const el = document.createElement('script');
        el.src = src; el.onload = res; el.onerror = () => rej(new Error('تعذر تحميل ' + src));
        document.head.appendChild(el);
      });
    }
    function parseTime(t) { const e = t.trim().split(':'); return 3600 * parseFloat(e[0] || '0') + 60 * parseFloat(e[1] || '0') + parseFloat(e[2] || '0'); }
    async function initFfmpegCore() {
      if (ffCore) return ffCore;
      appendLog('# Loading encoding core (~32MB)');
      await loadScript('ffmpeg-core.js');
      ffDuration = 0;
      ffCore = await createFFmpegCore({ locateFile: (f) => f.endsWith('.wasm') ? 'ffmpeg-core.wasm' : f });
      ffCore.setLogger(({ type, message }) => {
        if (type !== 'stderr' || !message) return;
        if (message.startsWith('  Duration')) { const m = message.match(/Duration: (\S+)/); if (m) ffDuration = parseTime(m[1]); }
        else if (message.startsWith('frame=') && ffDuration > 0) { const m = message.match(/time=(\S+)/); if (m) setLabel('جارٍ المعالجة ' + Math.round(Math.min(parseTime(m[1]) / ffDuration, .99) * 100) + '%'); }
      });
      appendLog('Core ready', 'success');
      return ffCore;
    }
    function ffClean() { if (ffCore) ['input.mp4', 'output.mp4'].forEach(f => { try { ffCore.FS.unlink(f); } catch (e) {} }); }
    function ffExit() { if (ffCore) { try { ffCore.exit && ffCore.exit(); } catch (e) {} ffCore = null; ffDuration = 0; } }

    async function processBuffer(data, fpsLabel) {
      const itsscale = fpsLabel === '60' ? '2' : '1';
      appendLog('# Loading security protocols'); await wait(1000);
      const o = await initFlowtikWasm();
      if (!o) throw new Error('Security verification failed: WASM module is missing or corrupted.');
      if (fpsLabel === '120') {
        appendLog('# Initializing bytecode engine'); await wait(1500);
        const p = o.exports.memory, g = 65536, F = data.byteLength, L = g + F * 2 + 8 * 1024 * 1024;
        if (p.buffer.byteLength < L) p.grow(Math.ceil(L / 65536) - p.buffer.byteLength / 65536);
        new Uint8Array(p.buffer).set(new Uint8Array(data), g); data = null;
        appendLog('# Parsing MP4 structure'); await wait(1500);
        appendLog('# Establishing frame injection'); await wait(1500);
        const x = o.exports.patch(g, F);
        if (!x) throw new Error('Processing failed (error code ' + o.exports.get_error() + ').');
        appendLog('# Injecting temporal frames'); await wait(1500);
        const P = o.exports.get_output_ptr();
        const v = p.buffer.slice(P, P + x);
        appendLog('# Finalizing output buffer — complete', 'success'); await wait(500);
        return v;
      }
      appendLog('# Initializing slow-motion engine'); await wait(1500);
      const c = await initFfmpegCore(); ffClean();
      appendLog('# Loading input stream'); await wait(1500);
      c.FS.writeFile('input.mp4', new Uint8Array(data)); data = null;
      appendLog('# Applying temporal scaling'); await wait(1500);
      const h = c.exec('-itsscale', itsscale, '-i', 'input.mp4', '-c:v', 'copy', '-c:a', 'copy',
        '-map_metadata', '-1', '-map_metadata:s:v', '-1', '-map_metadata:s:a', '-1', '-map_chapters', '-1',
        '-metadata', 'title=Flowtik', '-metadata', 'comment=flowtik.org',
        '-metadata', 'artist=flowtik.org', 'output.mp4');
      if (h !== 0) throw new Error('Core exited with code ' + h);
      const b = c.FS.readFile('output.mp4').buffer.slice(0);
      ffClean();
      appendLog('# Finalizing output buffer — complete', 'success'); await wait(500);
      ffExit();
      return b;
    }
    window.processBuffer = processBuffer;

    function pickFile(file) {
      if (!file || busy) return;
      if (file.type && !file.type.startsWith('video/')) { alert('الملف لازم يكون فيديو'); return; }
      currentFile = file;
      labelName.textContent = file.name;
      labelSize.textContent = (file.size / 1048576).toFixed(2) + ' MB';
      fileBox.style.display = 'flex';
      dropArea.style.display = 'none';
      btnProcess.style.display = 'flex';
      btnProcess.disabled = false;
      btnDownload.style.display = 'none';
      terminalBox.innerHTML = ''; terminalBox.style.display = 'none';
      idleLabel();
    }

    function resetFile() {
      if (busy) return;
      currentFile = null; mediaInput.value = '';
      fileBox.style.display = 'none'; dropArea.style.display = '';
      btnProcess.disabled = true; idleLabel(); btnProcess.style.display = 'flex';
      btnDownload.style.display = 'none';
      terminalBox.innerHTML = ''; terminalBox.style.display = 'none';
    }

    async function runProcess() {
      if (!currentFile || busy) return;
      busy = true; btnProcess.disabled = true;
      const fpsLabel = selectedFps === 120 ? '120' : '60';
      setLabel('جارٍ المعالجة...');
      terminalBox.innerHTML = '';
      try {
        const out = await processBuffer(await currentFile.arrayBuffer(), fpsLabel);
        const blob = new Blob([out], { type: 'video/mp4' });
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        btnDownload.href = lastUrl;
        btnDownload.download = 'Flowtik_' + fpsLabel + 'fps.mp4';
        btnDownload.style.display = 'flex';
        btnProcess.style.display = 'none';
        appendLog('✅ تم — ' + (blob.size / 1048576).toFixed(2) + ' MB', 'success');
      } catch (err) {
        ffClean(); ffExit();
        appendLog('Error: ' + err.message, 'warning');
        btnProcess.disabled = false; setLabel('إعادة المحاولة');
      } finally { busy = false; }
    }
    window.runProcess = runProcess;

    dropArea.addEventListener('click', () => mediaInput.click());
    mediaInput.addEventListener('change', (e) => pickFile(e.target.files && e.target.files[0]));
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
    dropArea.addEventListener('drop', (e) => { e.preventDefault(); dropArea.classList.remove('dragover'); pickFile(e.dataTransfer.files[0]); });
    btnCancel.addEventListener('click', resetFile);
    window.__flowtikReady = true;
  </script>
