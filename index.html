<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أبو عسرة">
  <meta name="theme-color" content="#000000">
  <title>أبو عسرة | 120 FPS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #000000;
      --card: #0c0d11;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --primary: #00f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px) 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-icon {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 25px rgba(0,242,254,0.25);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.2);
      color: var(--primary);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .logo-badge span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00f2fe;
      display: inline-block;
      box-shadow: 0 0 8px #00f2fe;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drop-zone {
      border: 1.5px dashed var(--card-border);
      border-radius: 18px;
      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.015);
      transition: all 0.2s ease;
      text-align: center;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: rgba(0, 242, 254, 0.4);
      background: rgba(0, 242, 254, 0.03);
    }

    .drop-zone:active {
      transform: scale(0.99);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
    }

    .drop-text {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffffff;
    }

    .drop-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    .file-badge {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .file-details {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .file-name {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }

    .file-size {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-clear {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      background: rgba(255, 50, 50, 0.15);
      color: #ff6b6b;
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: #ffffff;
      color: #000000;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.98);
      background: #e4e4e7;
    }

    .btn-main:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      transform: none;
    }

    .btn-download {
      display: none;
      background: #22c55e;
      color: #000000;
      text-decoration: none;
    }

    .btn-download:hover, .btn-download:active {
      background: #16a34a;
    }

    .status-terminal {
      background: #000000;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #a1a1aa;
      max-height: 110px;
      overflow-y: auto;
      display: none;
    }

    .status-line {
      display: flex;
      gap: 6px;
    }

    .status-line span.dot {
      color: #00f2fe;
    }

    .guide-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      padding: 0 10px;
    }

    .guide-text b {
      color: #e4e4e7;
      font-weight: 600;
    }
  </style>
</head>

  <div class="container">
    <header>
      <img src="apple-touch-icon.png" alt="أبو عسرة" class="app-icon">
      <div class="logo-badge">
        <span></span> FLOWTIK 120 FPS ORIGINAL ENGINE
      </div>
      <h1>أبو عسرة</h1>
      <p class="subtitle">محرك Flowtik 120 FPS الرسمي بدون أي تعديل</p>
    </header>

    <div class="card">
      <div class="drop-zone" id="dropArea">
        <div class="icon-box">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
          </svg>

        <div class="drop-text">اختر الفيديو من ألبوم الصور</div>

      </div>
      <input type="file" id="mediaInput" accept="video/mp4,video/quicktime,video/*">

      <div class="file-badge" id="fileBox">
        <div class="file-details">
          <div>
            <div class="file-name" id="labelName">video.mp4</div>
            <div class="file-size" id="labelSize">0.0 MB</div>
          </div>
        </div>
        <button class="btn-clear" id="btnCancel" title="إلغاء">✕</button>
      </div>

      <button class="btn-main" id="btnProcess" disabled onclick="runProcess()">
        <span>بدء معالجة Flowtik 120 FPS</span>
      </button>

      <a class="btn-main btn-download" id="btnDownload" download="flowtik_output.mp4">
        <span>تحميل الفيديو الناتج</span>
      </a>

      <div class="status-terminal" id="terminalBox"></div>
    </div>

    <div class="guide-text">
      للإضافة كتطبيق سريع في الآيفون: اضغط <b>مشاركة</b> في سفاري ثم <b>إضافة إلى الشاشة الرئيسية</b>.
    </div>
  </div>

    let wasmInstance = null;
    let currentFile = null;

    const dropArea = document.getElementById('dropArea');
    const mediaInput = document.getElementById('mediaInput');
    const fileBox = document.getElementById('fileBox');
    const labelName = document.getElementById('labelName');
    const labelSize = document.getElementById('labelSize');
    const btnCancel = document.getElementById('btnCancel');
    const btnProcess = document.getElementById('btnProcess');
    const btnDownload = document.getElementById('btnDownload');
    const terminalBox = document.getElementById('terminalBox');

    const sleep = (t) => new Promise(e => setTimeout(e, t));

    function appendLog(text) {
      terminalBox.style.display = 'block';
      const row = document.createElement('div');
      row.className = 'status-line';
      row.innerHTML = '<span class="dot">•</span> <span>' + text + '</span>';
      terminalBox.appendChild(row);
      terminalBox.scrollTop = terminalBox.scrollHeight;
    }

    async function initFlowtikWasm() {
      if (wasmInstance) return wasmInstance;
      appendLog('# Loading security protocols');
      const bin = Uint8Array.from(atob(FLOWTIK_WASM_BASE64), c => c.charCodeAt(0));
      const res = await WebAssembly.instantiate(bin);
      wasmInstance = res.instance;
      wasmInstance.exports.decrypt_secrets();
      return wasmInstance;
    }

    dropArea.onclick = () => mediaInput.click();

    mediaInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) pickFile(file);
    };

    dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('dragover'); };
    dropArea.ondragleave = () => dropArea.classList.remove('dragover');
    dropArea.ondrop = (e) => {
      e.preventDefault();
      dropArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) pickFile(file);
    };

    function pickFile(file) {
      currentFile = file;
      labelName.textContent = file.name;
      labelSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
      fileBox.style.display = 'flex';
      dropArea.style.display = 'none';
      btnProcess.disabled = false;
      btnProcess.style.display = 'flex';
      btnDownload.style.display = 'none';
      terminalBox.innerHTML = '';
      terminalBox.style.display = 'none';
    }

    btnCancel.onclick = () => {
      currentFile = null;
      mediaInput.value = '';
      fileBox.style.display = 'none';
      dropArea.style.display = 'flex';
      btnProcess.disabled = true;
      btnDownload.style.display = 'none';
      terminalBox.style.display = 'none';
      terminalBox.innerHTML = '';
