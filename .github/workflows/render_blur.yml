name: Render Blur Video (PC Engine)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct URL to input video'
        required: true
      blur_amount:
        description: 'Blur Amount (e.g. 1.0)'
        default: '1.0'
        required: false
      blur_weighting:
        description: 'Blur Weighting function'
        default: 'gaussian_sym'
        required: false
      output_fps:
        description: 'Output framerate'
        default: '60'
        required: false
      interpolated_fps:
        description: 'Interpolated FPS'
        default: '600'
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          mkdir -p workspace
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Target Video
        run: |
          curl -L -o workspace/input_video.mp4 "${{ github.event.inputs.video_url }}"
          ls -lh workspace/

      - name: Render Real Motion Blur Video
        run: |
          echo "Starting High-Speed Real Motion Blur..."
          ffmpeg -i workspace/input_video.mp4 \
            -vf "tblend=all_mode=average" \
            -c:v libx264 -crf 17 -preset ultrafast -c:a copy workspace/output_blurred.mp4 -y

      - name: Upload Processed Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abu_asrah_blurred_video
          path: workspace/output_blurred.mp4
          retention-days: 1
